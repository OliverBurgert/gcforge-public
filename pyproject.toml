[project]
name = "gcforge"
version = "0.4.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "django>=6.0.3",
    "keyring>=25.7.0",
    "odfpy>=1.4.1",
    "pillow>=12.2.0",
    "pmtiles>=3.7.0",
    "pycountry>=24.6.1",
    "requests>=2.32.0",
    "srtm-py>=0.3.7",
    "timezonefinder>=6.5.0",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.7.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gcforge.settings"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    "*/migrations/*",
    "scripts/stubs/*",
    "site/*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports, etc.)
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear (likely bugs)
]
ignore = [
    "E501",  # line too long (formatter's job)
    "E731",  # lambda assignment
    "E402",  # module-level import not at top (used in scripts/settings_public.py)
    "E741",  # ambiguous variable names (existing codebase uses single-letter names)
    "B008",  # function calls in default args (Django uses these)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports from package roots
"**/settings.py" = ["F405", "F403"]  # star imports in Django settings
"**/tests/**" = [
    "F841",  # unused locals — common pattern for setUp side-effects
    "B007",  # unused loop control vars
    "E702",  # multi-statement lines in compact test setup
]
