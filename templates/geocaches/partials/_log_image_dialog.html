{% load i18n l10n static %}
{# Image attachment dialog — included once per page that uses _log_form_fields.html #}
{# Uses Bootstrap modal. Controlled by gcfImageDialog JS object. #}
<div id="logImageDialogConfig"
     data-default-max-px="{{ log_image_max_px|default:1024|unlocalize }}"
     data-default-strip-exif="{{ log_image_strip_exif|default:True|lower }}"
     style="display:none"></div>
<div class="modal fade" id="logImageModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title mb-0">{% trans "Attach Image" %}</h6>
        <button type="button" class="btn-close btn-sm" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body py-3">
        <div class="row g-3">
          <div class="col">

            <div class="mb-2">
              <label class="form-label small mb-1">{% trans "File" %} <span class="text-danger">*</span></label>
              <input type="file" id="imgDlgFile" class="form-control form-control-sm"
                     accept="image/jpeg,image/png,image/gif">
              <div id="imgDlgFileInfo" class="text-muted mt-1" style="font-size:.75rem"></div>
            </div>

            <div class="mb-2">
              <label class="form-label small mb-1">{% trans "Title" %}</label>
              <input type="text" id="imgDlgTitle" class="form-control form-control-sm"
                     maxlength="100" placeholder="{% trans 'Optional image title' %}">
            </div>

            <div class="mb-2" id="imgDlgDescWrap">
              <label class="form-label small mb-1">{% trans "Description" %} <span class="text-muted">{% trans "(GC only, 500 chars)" %}</span></label>
              <textarea id="imgDlgDesc" class="form-control form-control-sm" rows="2" maxlength="500"></textarea>
            </div>

            <div class="mb-2" id="imgDlgSpoilerWrap" style="display:none">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="imgDlgSpoiler">
                <label class="form-check-label small" for="imgDlgSpoiler">{% trans "Spoiler (OC only)" %}</label>
              </div>
            </div>

            <div class="row g-2 align-items-end">
              <div class="col-auto">
                <label class="form-label small mb-1">{% trans "Rotate" %}</label>
                <select id="imgDlgRotate" class="form-select form-select-sm" style="width:auto">
                  <option value="0">{% trans "None" %}</option>
                  <option value="90">90°</option>
                  <option value="180">180°</option>
                  <option value="270">270°</option>
                </select>
              </div>
              <div class="col-auto">
                <label class="form-label small mb-1">{% trans "Max size" %}</label>
                <select id="imgDlgMaxPx" class="form-select form-select-sm" style="width:auto">
                  <option value="512">512 px</option>
                  <option value="1024">1024 px</option>
                  <option value="1600">1600 px</option>
                  <option value="2048">2048 px</option>
                  <option value="0">{% trans "Original" %}</option>
                </select>
              </div>
              <div class="col-auto pb-1">
                <div class="form-check mb-0">
                  <input type="checkbox" class="form-check-input" id="imgDlgStripExif" checked>
                  <label class="form-check-label small" for="imgDlgStripExif">{% trans "Strip EXIF" %}</label>
                </div>
              </div>
            </div>

          </div>
          <div class="col-auto d-flex align-items-start justify-content-center" style="width:200px">
            <div id="imgDlgPreviewBox"
                 class="border rounded d-flex align-items-center justify-content-center bg-body-secondary overflow-hidden"
                 style="width:180px;height:180px">
              <span id="imgDlgPreviewPlaceholder" class="text-muted small text-center px-2">{% trans "No preview" %}</span>
              <img id="imgDlgPreview" alt="" style="display:none;width:100%;height:100%;object-fit:contain">
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer py-2">
        <div id="imgDlgError" class="text-danger small me-auto"></div>
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">{% trans "Cancel" %}</button>
        <button type="button" class="btn btn-sm btn-primary" id="imgDlgAttach">{% trans "Attach" %}</button>
      </div>
    </div>
  </div>
</div>
<script src="{% static 'js/log-image-dialog.js' %}"></script>
