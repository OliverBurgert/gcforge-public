{% load i18n %}
{% comment %}
Bars/pie view toggle for a breakdown.  Caller passes `chart` (a key like
"type" or "size") matching the .gcf-chart-bars / .gcf-chart-pie containers and
the json_script data id.  Wired by static/js/dashboard-charts.js.
{% endcomment %}
<div class="btn-group btn-group-sm gcf-chart-toggle" data-chart="{{ chart }}" role="group">
  <button type="button" class="btn btn-outline-secondary active" data-view="bars"
          title="{% trans 'Bars' %}" aria-label="{% trans 'Bars' %}">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <rect x="1" y="9" width="3" height="6"/><rect x="6.5" y="5" width="3" height="10"/>
      <rect x="12" y="2" width="3" height="13"/>
    </svg>
  </button>
  <button type="button" class="btn btn-outline-secondary" data-view="pie"
          title="{% trans 'Pie chart' %}" aria-label="{% trans 'Pie chart' %}">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 1a7 7 0 1 0 7 7H8z"/><path d="M7 0v7H0a7 7 0 0 1 7-7z" opacity=".55"/>
    </svg>
  </button>
</div>
