{% load i18n %}
{% comment %}Modal body: assign/unassign tags for one souvenir.{% endcomment %}
<form hx-post="{% url 'geocaches:dashboard_souvenirs_set_tags' %}" hx-swap="none">
  {% csrf_token %}
  <input type="hidden" name="sid" value="{{ souvenir.id }}">
  <p class="fw-semibold mb-2">{{ souvenir.title }}</p>
  <div class="mb-3" style="max-height:240px; overflow-y:auto">
    {% for t in all_tags %}
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="tag" value="{{ t.id }}"
             id="ed-tag-{{ t.id }}" {% if t.id in assigned %}checked{% endif %}>
      <label class="form-check-label" for="ed-tag-{{ t.id }}">{{ t.name }}</label>
    </div>
    {% empty %}
    <p class="text-muted small mb-0">{% trans "No tags yet — create one below." %}</p>
    {% endfor %}
  </div>
  <div class="mb-3">
    <label class="form-label small" for="ed-new-tag">{% trans "Create new tag" %}</label>
    <input class="form-control form-control-sm" type="text" name="new_tag" id="ed-new-tag" maxlength="100">
  </div>
  <div class="text-end">
    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">{% trans "Cancel" %}</button>
    <button type="submit" class="btn btn-sm btn-primary">{% trans "Save" %}</button>
  </div>
</form>
