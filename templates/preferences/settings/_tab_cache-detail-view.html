{% load i18n %}
    <div class="tab-pane{% if active_tab == 'cache-detail-view' %} active show{% endif %}" id="cache-detail-view">
      <div class="card">
        <div class="card-body">
          <form method="post" action="{% url 'preferences:save_cache_detail' %}">
            {% csrf_token %}

            <div class="row g-4">

              <div class="col-md-6">
                <h6>{% trans "Hint display" %}</h6>
                <div class="d-flex flex-column gap-2">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="hint_display" id="hint_hidden"
                           value="hidden" {% if hint_display == "hidden" %}checked{% endif %}>
                    <label class="form-check-label" for="hint_hidden">
                      {% blocktrans %}<strong>Hidden</strong> — collapsed; click to reveal{% endblocktrans %}
                    </label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="hint_display" id="hint_decrypted"
                           value="decrypted" {% if hint_display == "decrypted" %}checked{% endif %}>
                    <label class="form-check-label" for="hint_decrypted">
                      {% blocktrans %}<strong>Shown decrypted</strong> — always visible in plain text{% endblocktrans %}
                    </label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="hint_display" id="hint_encrypted"
                           value="encrypted" {% if hint_display == "encrypted" %}checked{% endif %}>
                    <label class="form-check-label" for="hint_encrypted">
                      {% blocktrans %}<strong>Shown encrypted (ROT13)</strong> — shown as ROT13; click to decode{% endblocktrans %}
                    </label>
                  </div>
                </div>
              </div>

              <div class="col-md-6">
                <h6>{% trans "Log text truncation" %}</h6>
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" name="log_truncate" value="1"
                         id="log_truncate" {% if log_truncate %}checked{% endif %}>
                  <label class="form-check-label" for="log_truncate">
                    {% blocktrans %}<strong>Truncate long log texts</strong>
                    <span class="text-muted small ms-1">— show "more" link to expand</span>{% endblocktrans %}
                  </label>
                </div>
                <div class="ms-4 d-flex align-items-center gap-2" id="log-truncate-length-row"
                     {% if not log_truncate %}style="opacity:.5;pointer-events:none"{% endif %}>
                  <label class="form-label small mb-0" for="log_truncate_length">{% trans "Max characters:" %}</label>
                  <input type="number" name="log_truncate_length" id="log_truncate_length"
                         class="form-control form-control-sm" style="width:90px"
                         min="50" max="5000" value="{{ log_truncate_length }}">
                </div>
                <p class="text-muted small mt-2 mb-0 ms-4">{% trans "Uncheck to always show full log text." %}</p>
              </div>

            </div>

            <button type="submit" class="btn btn-sm btn-primary mt-3">{% trans "Save" %}</button>
          </form>
        </div>
      </div>
    </div>
